[project]
name = "rolling-forecast"
version = "0.2.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
# Phase 0: catch real bugs; expand gradually without blocking on style debt
select = ["E", "F", "W"]
ignore = [
  "E501",  # line length
  "E402",  # late imports (FastAPI app wiring, alembic)
  "E712",  # SQLAlchemy `== True` comparisons
  "E741",  # ambiguous names in math-heavy forecast code
  "W293",  # trailing whitespace in doc/markdown strings
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E402", "F401"]
"tests/**" = ["F401", "F811", "F841"]
"app/main.py" = ["E402"]
"app/models/**" = ["F821"]  # forward refs in Mapped["Model"] annotations

[tool.coverage.run]
source = ["app"]
omit = [
  "app/workers/*",
  "app/services/observability.py",
  "app/services/versioning.py",
  # Remaining low-coverage modules kept out of the 60% gate.
  # Now counted: app/api/dashboard.py (batching + panel regression suite)
  "app/api/integrations.py",
  "app/api/admin_fx.py",
  "app/services/ingestion/erp_adapter.py",
  "app/services/locks.py",
  "app/services/board_pack.py",
  "app/services/document_processor.py",
]

[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
allow_untyped_defs = true
# Hard gate in CI. app/ is fully type-clean — do not reintroduce a per-module
# ignore_errors block; fix the module instead.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "app.models.*"
# SQLAlchemy forward refs in Mapped["X"] — names resolve at runtime via relationship strings
disable_error_code = ["name-defined"]

[[tool.mypy.overrides]]
module = [
  "alembic.*",
  "migration_helpers",
]
# Alembic migration scripts are imperative and heavily dynamic
ignore_errors = true
