# ──────────────────────────────────────────────────────────
# Rolling Forecast — Docker Compose
# ──────────────────────────────────────────────────────────
#
# Usage:
#   Development:  docker compose up --build
#   With Redis:   docker compose --profile redis up --build
#   Postgres:     docker compose --profile postgres up --build
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Logs:         docker compose logs -f backend
#   Stop:         docker compose down
#
# ──────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    container_name: forecast-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forecast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rolling_forecast}
    ports:
      - "5432:5432"
    volumes:
      - forecast-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forecast} -d ${POSTGRES_DB:-rolling_forecast}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  redis:
    image: redis:7-alpine
    container_name: forecast-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["redis"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forecast-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./rolling_forecast.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/skills:/app/skills
      - ./backend/seed_data:/app/seed_data
      - forecast-db:/app/data
      - forecast-uploads:/app/uploads
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forecast-worker
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./rolling_forecast.db
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./backend/app:/app/app
      - forecast-db:/app/data
      - forecast-uploads:/app/uploads
    command: arq app.workers.arq_worker.WorkerSettings
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["redis"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: forecast-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    command: npx vite --host 0.0.0.0 --port 5173
    environment:
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  forecast-db:
    driver: local
  forecast-uploads:
    driver: local
  forecast-pgdata:
    driver: local
