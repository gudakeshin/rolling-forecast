# ──────────────────────────────────────────────────────────
# Rolling Forecast — Production Overrides
# ──────────────────────────────────────────────────────────
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ──────────────────────────────────────────────────────────

services:
  backend:
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    volumes:
      # No source mount in production
      - forecast-db:/app/data
      - forecast-uploads:/app/uploads
    environment:
      - APP_ENV=production
      - LOG_LEVEL=WARNING

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    volumes: []  # No source mount in production
