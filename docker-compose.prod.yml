# ──────────────────────────────────────────────────────────
# Rolling Forecast — Production Overrides
# ──────────────────────────────────────────────────────────
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ──────────────────────────────────────────────────────────

services:
  db:
    profiles: []  # enable postgres in prod
    restart: unless-stopped

  backend:
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2"
    volumes:
      - forecast-db:/app/data
      - forecast-uploads:/app/uploads
      - forecast-exports:/app/exports
    environment:
      - APP_ENV=production
      - LOG_LEVEL=WARNING
      - SEED_DEMO_USERS=false
      - ALLOW_OPEN_REGISTRATION=false
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:8080"
    volumes: []
    depends_on:
      - backend

volumes:
  forecast-exports:
    driver: local
