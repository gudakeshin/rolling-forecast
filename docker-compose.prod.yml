# ──────────────────────────────────────────────────────────
# Rolling Forecast — Production Overrides
# ──────────────────────────────────────────────────────────
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ──────────────────────────────────────────────────────────

services:
  db:
    profiles: []  # enable postgres in prod
    restart: unless-stopped

  backend:
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2"
    volumes:
      - forecast-db:/app/data
      - forecast-uploads:/app/uploads
      - forecast-exports:/app/exports
    environment:
      - APP_ENV=production
      - LOG_LEVEL=WARNING
      - SEED_DEMO_USERS=false
      - ALLOW_OPEN_REGISTRATION=false
      - DATABASE_URL=postgresql://forecast:forecast@db:5432/rolling_forecast
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    volumes: []
    depends_on:
      - backend

volumes:
  forecast-exports:
    driver: local
