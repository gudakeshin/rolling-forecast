# Included at server level AND in every location that sets its own add_header:
# nginx drops inherited add_header directives in any block that declares one.
# Everything the app loads is self-hosted (fonts via @fontsource), so the
# policy only needs 'self'. 'unsafe-inline' for styles covers chart libraries
# that inject <style> tags; scripts stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
