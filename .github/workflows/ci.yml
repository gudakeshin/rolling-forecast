name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff mypy
      - name: Ruff
        run: ruff check app tests alembic
      - name: Mypy
        # Soft gate: existing type debt is tracked; do not block merges yet
        run: mypy app --ignore-missing-imports --no-error-summary
        continue-on-error: true

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest with coverage
        env:
          APP_ENV: test
          JWT_SECRET_KEY: test-secret-key-for-ci-at-least-32-chars
          DATABASE_URL: sqlite:///./test_ci.db
          SEED_DEMO_USERS: "true"
          ALLOW_OPEN_REGISTRATION: "true"
        run: |
          pip install pytest-cov
          pytest -q --tb=short --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=25
      - name: Security scans
        run: |
          pip install pip-audit bandit
          pip-audit -r requirements.txt --ignore-vuln GHSA-wj6h-64fc-37mp || true
          bandit -q -r app -x tests -ll

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forecast
          POSTGRES_PASSWORD: forecast
          POSTGRES_DB: rolling_forecast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecast -d rolling_forecast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Alembic upgrade head (clean Postgres)
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://forecast:forecast@localhost:5432/rolling_forecast
          JWT_SECRET_KEY: test-secret-key-for-ci-at-least-32-chars
        run: |
          alembic heads | tee /tmp/heads.txt
          # Must be a single head after merge revision
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic current | tee /tmp/current.txt
          grep -q "006_fx_accuracy" /tmp/current.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings 200
      - name: Unit tests
        run: npx vitest run --passWithNoTests
      - name: Playwright smoke
        # Self-skips when E2E_BASE_URL is unset (no browser install needed)
        run: npx playwright test
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: Build
        run: npm run build
